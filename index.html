<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#141a14" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='9' r='5.5' fill='%23242c44' stroke='%23f8d848' stroke-width='1.5'/%3E%3Ccircle cx='6' cy='7' r='1.3' fill='%23fff'/%3E%3Ccircle cx='10' cy='2.5' r='1.8' fill='%23f97316'/%3E%3C/svg%3E"
    />
    <title>microbomber · The Rust of Cinderholm</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #121712;
        color: #f4eedc;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      #app {
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100dvh;
        max-width: 560px;
        margin: 0 auto;
        background: #161d16;
        box-shadow: 0 0 32px rgba(0, 0, 0, 0.65);
      }
      img {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: calc(6px + env(safe-area-inset-top)) 10px 6px;
        background: #181c1a;
        border-bottom: 3px double #4c5e4e;
        flex-shrink: 0;
      }
      #stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        overflow: hidden;
        background: #101412;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        border: 2px solid #2d3a30;
        border-radius: 3px;
        box-shadow:
          0 0 0 2px #0a0d0b,
          0 8px 24px rgba(0, 0, 0, 0.65);
      }
      #controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
        background: linear-gradient(180deg, #212922 0%, #171d18 100%);
        border-top: 2px solid #354336;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="topbar"></header>
      <main id="stage">
        <canvas id="game"></canvas>
      </main>
      <footer id="controls"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
